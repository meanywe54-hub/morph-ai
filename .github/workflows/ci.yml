name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,openai]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: python scripts/check_links.py
      - run: python scripts/audit_release.py --history
      - run: python -m build
      - run: python scripts/smoke_wheel.py dist/morph_agent_evolution-0.1.0-py3-none-any.whl
